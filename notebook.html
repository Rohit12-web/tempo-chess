<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Notebook — Tempo</title>
    <link rel="icon" href="assets/favicon.svg" />
    <script src="js/helpers/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/learning.css" />
    <script src="js/helpers/auth.js" defer></script>
    <script src="js/helpers/profile.js" defer></script>
    <script src="js/core/engine.js" defer></script>
    <script src="js/helpers/game-data.js" defer></script>
    <script src="js/helpers/study-board.js" defer></script>
    <script src="js/helpers/sound.js" defer></script>
    <script src="js/helpers/select-menu.js" defer></script>
    <script src="js/helpers/notebook-data.js" defer></script>
    <script src="js/helpers/notebook-dialog.js" defer></script>
    <script src="js/notebook.js" defer></script>
    <link rel="stylesheet" href="css/study-tools.css" />
    <script src="js/helpers/preferences.js" defer></script>
  </head>
  <body class="checking-profile" data-profile-required="true">
    <aside class="app-rail">
      <a href="index.html" class="brand" aria-label="Tempo home"
        ><span class="brand-mark" aria-hidden="true">♜</span>tempo<span
          class="brand-period"
          >.</span
        ></a
      >
      <div>
        <p class="rail-label">YOUR CHESS SPACE</p>
        <nav class="rail-nav" aria-label="Main navigation">
          <a href="index.html" data-nav="home"
            ><span class="nav-symbol" aria-hidden="true">⌂</span>Home</a
          ><a href="play.html?mode=local" data-nav="play"
            ><span class="nav-symbol" aria-hidden="true">♙</span>Play</a
          ><a href="play.html?view=puzzles" data-nav="puzzles"
            ><span class="nav-symbol" aria-hidden="true">◇</span>Puzzles</a
          ><a href="play.html?mode=bot"
            ><span class="nav-symbol" aria-hidden="true">♞</span>Play a bot</a
          ><a href="openings.html" data-nav="openings"
            ><span class="nav-symbol" aria-hidden="true">♗</span>Openings</a
          ><a href="notebook.html" data-nav="notebook"
            ><span class="nav-symbol" aria-hidden="true">▤</span>Notebook</a
          ><a href="lessons.html" data-nav="lessons"
            ><span class="nav-symbol" aria-hidden="true">♙</span>Learn</a
          ><a href="statistics.html" data-nav="statistics"
            ><span class="nav-symbol" aria-hidden="true">▥</span>Progress</a
          >
        </nav>
      </div>
      <div class="rail-bottom">
        <div class="rail-profile">
          <span class="avatar" data-avatar>T</span>
          <div>
            <strong data-display-name>Player</strong
            ><small data-account-username>@player</small>
          </div>
        </div>
        <button class="profile-switch" data-logout>
          Log out
        </button>
      </div>
    </aside>
    <div class="app-content">
      <header class="app-topbar">
        <a class="text-link" href="index.html">← Your chess space</a>
        <div class="topbar-right">
          <span data-username>Player</span
          ><button
            class="round-button"
            data-theme-toggle
            aria-label="Switch colour theme"
          >
            ☾
          </button>
        </div>
      </header>
      <main class="dashboard">
        <div class="dashboard-heading">
          <div>
            <div class="eyebrow">YOUR OWN CHESS NOTES</div>
            <h1>Notebook<span>.</span></h1>
            <p>Keep a position. Remember the idea.</p>
          </div>
          <button class="pill primary" id="note-new">New note</button>
        </div>
        <label class="field-label" for="note-search">Search notes</label
        ><input
          class="study-input"
          id="note-search"
          type="search"
          placeholder="Title, note or source"
        />
        <p id="notebook-status" role="status"></p>
        <div class="notebook-layout">
          <section
            id="note-list"
            class="note-list"
            aria-label="Saved notes"
          ></section>
          <section class="feature-card" id="note-detail" hidden>
            <div class="study-player-row">
              <strong id="note-source"></strong
              ><button class="utility-button" id="note-flip">Flip board</button>
            </div>
            <div id="note-board"></div>
            <form id="note-form">
              <label for="note-title">Title</label
              ><input
                class="study-input"
                id="note-title"
                required
                maxlength="80"
              /><label for="note-text">Your note</label
              ><textarea
                class="study-input"
                id="note-text"
                rows="5"
                maxlength="4000"
              ></textarea>
              <div class="lesson-actions">
                <button class="pill primary" type="submit">Save changes</button
                ><button class="pill secondary" type="button" id="note-delete">
                  Delete note
                </button>
              </div>
            </form>
          </section>
        </div>
        <dialog
          class="study-dialog"
          id="note-delete-dialog"
          aria-labelledby="note-delete-title"
        >
          <h2 id="note-delete-title">Delete this note?</h2>
          <p id="note-delete-name"></p>
          <p>
            This removes the note from this profile. Your game and puzzle
            progress stay.
          </p>
          <div class="dialog-actions">
            <button class="dialog-secondary" id="note-keep" autofocus>
              Keep note</button
            ><button class="dialog-primary" id="note-remove">
              Delete note
            </button>
          </div>
        </dialog>
      </main>
    </div>
  </body>
</html>
