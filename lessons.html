<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Learn the basics — Tempo</title>
    <link rel="icon" href="assets/favicon.svg" />
    <script src="js/helpers/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/learning.css" />
    <script src="js/helpers/auth.js" defer></script>
    <script src="js/helpers/profile.js" defer></script>
    <script src="js/core/engine.js" defer></script>
    <script src="js/helpers/game-data.js" defer></script>
    <script src="js/helpers/study-board.js" defer></script>
    <script src="js/helpers/sound.js" defer></script>
    <script src="js/helpers/select-menu.js" defer></script>
    <script src="js/helpers/notebook-data.js" defer></script>
    <script src="js/helpers/notebook-dialog.js" defer></script>
    <script src="js/data/lesson-data.js" defer></script>
    <script src="js/lessons.js" defer></script>
    <link rel="stylesheet" href="css/study-tools.css" />
    <script src="js/helpers/preferences.js" defer></script>
  </head>
  <body class="checking-profile" data-profile-required="true">
    <aside class="app-rail">
      <a href="index.html" class="brand" aria-label="Tempo home"
        ><span class="brand-mark" aria-hidden="true">♜</span>tempo<span
          class="brand-period"
          >.</span
        ></a
      >
      <div>
        <p class="rail-label">YOUR CHESS SPACE</p>
        <nav class="rail-nav" aria-label="Main navigation">
          <a href="index.html" data-nav="home"
            ><span class="nav-symbol" aria-hidden="true">⌂</span>Home</a
          ><a href="play.html?mode=local" data-nav="play"
            ><span class="nav-symbol" aria-hidden="true">♙</span>Play</a
          ><a href="play.html?view=puzzles" data-nav="puzzles"
            ><span class="nav-symbol" aria-hidden="true">◇</span>Puzzles</a
          ><a href="play.html?mode=bot"
            ><span class="nav-symbol" aria-hidden="true">♞</span>Play a bot</a
          ><a href="openings.html" data-nav="openings"
            ><span class="nav-symbol" aria-hidden="true">♗</span>Openings</a
          ><a href="notebook.html" data-nav="notebook"
            ><span class="nav-symbol" aria-hidden="true">▤</span>Notebook</a
          ><a href="lessons.html" data-nav="lessons"
            ><span class="nav-symbol" aria-hidden="true">♙</span>Learn</a
          ><a href="statistics.html" data-nav="statistics"
            ><span class="nav-symbol" aria-hidden="true">▥</span>Progress</a
          >
        </nav>
      </div>
      <div class="rail-bottom">
        <div class="rail-profile">
          <span class="avatar" data-avatar>T</span>
          <div>
            <strong data-display-name>Player</strong
            ><small data-account-username>@player</small>
          </div>
        </div>
        <button class="profile-switch" data-logout>
          Log out
        </button>
      </div>
    </aside>
    <div class="app-content">
      <header class="app-topbar">
        <a class="text-link" href="index.html">← Your chess space</a>
        <div class="topbar-right">
          <span data-username>Player</span
          ><button
            class="round-button"
            data-theme-toggle
            aria-label="Switch colour theme"
          >
            ☾
          </button>
        </div>
      </header>
      <main class="dashboard">
        <div class="dashboard-heading">
          <div>
            <div class="eyebrow">START WITH THE ESSENTIALS</div>
            <h1>Learn the basics<span>.</span></h1>
            <p>Five rules. Five small moments of practice.</p>
          </div>
          <span class="quiet-badge" id="lesson-progress"></span>
        </div>
        <div id="lesson-library" class="opening-library"></div>
        <section class="study-workspace">
          <div class="feature-card study-board-card">
            <div class="study-player-row">
              <strong id="lesson-turn">White to move</strong
              ><button class="utility-button" id="lesson-flip">
                Flip board
              </button>
            </div>
            <div id="lesson-board"></div>
            <p class="study-feedback" id="lesson-feedback" role="status"></p>
          </div>
          <aside class="feature-card lesson-panel">
            <div class="eyebrow">UNDERSTAND, THEN TRY</div>
            <h2 id="lesson-title"></h2>
            <p id="lesson-intro"></p>
            <p class="lesson-note" id="lesson-goal"></p>
            <div id="lesson-promotion-field" hidden>
              <label class="field-label" for="lesson-promotion"
                >Promote to</label
              ><select class="setup-select" id="lesson-promotion">
                <option value="q">Queen</option>
                <option value="r">Rook</option>
                <option value="b">Bishop</option>
                <option value="n">Knight</option>
              </select>
            </div>
            <p id="lesson-why" hidden></p>
            <div class="lesson-actions">
              <button class="dialog-secondary" id="lesson-hint">Hint</button
              ><button class="dialog-secondary" id="lesson-reset">
                Try again
              </button>
            </div>
            <button class="pill primary" id="lesson-next">Next lesson →</button>
          </aside>
        </section>
      </main>
    </div>
  </body>
</html>
