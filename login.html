<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in — TempoChess</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <script src="js/helpers/theme.js"></script>
  <link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/site.css"><link rel="stylesheet" href="css/auth.css">
  <script src="js/helpers/auth.js" defer></script><script src="js/auth.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <header class="auth-header"><a href="landing.html" class="brand"><span class="brand-mark" aria-hidden="true">♜</span>tempo<span class="brand-period">.</span></a><button class="round-button" data-theme-toggle aria-label="Switch color theme">☾</button></header>
    <section class="auth-card" aria-labelledby="login-title">
      <div class="eyebrow">WELCOME BACK</div><h1 id="login-title">Log in to your board.</h1><p>One local login opens your player dashboard or the administrator workspace.</p>
      <form id="login-form" class="auth-form">
        <label for="login-username">Username</label><input class="auth-input" id="login-username" name="username" required minlength="3" maxlength="24" autocomplete="username">
        <label for="login-password">Password</label><div class="auth-input-wrap"><input class="auth-input" id="login-password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password"><button class="password-toggle" type="button" data-password-toggle="login-password">Show</button></div>
        <p id="login-error" class="auth-error" role="alert" aria-live="polite"></p><button class="pill primary auth-submit" type="submit">Log in</button>
      </form>
      <div class="auth-links"><a class="text-link" href="signup.html">Create a player account</a><a class="text-link" href="landing.html">Back to landing page</a></div>
      <p class="auth-note">Accounts, sessions and progress stay in this browser. This is not secure public-site authentication.</p>
    </section>
  </main>
</body>
</html>
